[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "traceseal-langchain"
version = "0.2.0"
description = "Signed execution receipts for every LangChain model and tool call."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
keywords = ["langchain", "langgraph", "observability", "receipts", "ed25519", "traceseal", "compliance", "audit"]
authors = [{name = "Traceseal"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "traceseal-observe>=1.5",
    "langchain-core>=1.1.2",  # first release that passes tool_call_id to on_tool_start
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "langchain>=1.0",
]

[project.urls]
Homepage = "https://traceseal.io"
Specification = "https://traceseal.io/spec"
Source = "https://github.com/traceseal/traceseal-langchain"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
